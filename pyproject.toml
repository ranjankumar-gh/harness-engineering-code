[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness"
version = "0.1.0"
description = "The companion code for Harness Engineering for Production AI Systems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ranjan Kumar" }]
dependencies = [
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
# Only the chapters that wire a graph need these. Nothing below harness/graph/
# imports them, and the test suite runs without them: with langgraph uninstalled, 292 of
# the 386 tests pass and 20 skip, the other two files being skipped whole. Deleting
# harness/graph/ instead is a different experiment with a different answer, 323, and the
# closing chapter runs both because conflating them flatters the claim.
#
# That second clause was false until the closing chapter checked it. Two test files
# imported langgraph at module scope with no guard, so 76 tests failed to collect
# instead of skipping, and this comment had been wrong since Chapter 12 because nobody
# ran the case it describes. Both files now carry the guard the other eight already had.
graph = [
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    # Chapter 12's store. Its own distribution: installing langgraph does not
    # bring the SQLite saver with it, and the import failure takes the suite.
    "langgraph-checkpoint-sqlite>=3.1,<4",
]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "langgraph>=1.2,<2",   # the graph tests in Chapter 4 onward; still no network or key
    "langgraph-checkpoint-sqlite>=3.1,<4",   # Chapter 12's resume tests
]

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["harness", "tests", "examples"]
