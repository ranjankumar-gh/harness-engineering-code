# The gate policy for the billing support agent.
#
# Every rule answers one question: given what being wrong would cost, who is allowed to
# decide? Code, a person, or nobody.
#
# A tool with no rule for the current mode is refused. There is no default-allow, and
# adding a tool to the agent is therefore an edit to this file.

# ------------------------------------------------------------------ reads
# Reversible, no amount, nothing to threshold. Code decides.

# Chapter 10 added these four. The tool registry offered them in both modes and this
# file had no rule for any of them, so under Chapter 9's fail-closed rule the agent could
# read a ticket, reason about it perfectly, and then fail to close it. Two files listed
# the same tools by hand and disagreed within one chapter of each other.

[[rule]]
tool = "search_tickets"
mode = "copilot"

[[rule]]
tool = "search_tickets"
mode = "queue-drain"

[[rule]]
tool = "get_ticket"
mode = "copilot"

[[rule]]
tool = "get_ticket"
mode = "queue-drain"

[[rule]]
tool = "get_account"
mode = "copilot"

[[rule]]
tool = "get_account"
mode = "queue-drain"

[[rule]]
tool = "close_ticket"
mode = "copilot"

[[rule]]
tool = "close_ticket"
mode = "queue-drain"

[[rule]]
tool = "get_invoice"
mode = "copilot"

[[rule]]
tool = "get_invoice"
mode = "queue-drain"

[[rule]]
tool = "search_kb"
mode = "copilot"

[[rule]]
tool = "search_kb"
mode = "queue-drain"

# ------------------------------------------------------------- reversible writes
# apply_credit is reversible by counter-entry and leaves an audit trail, so the bands
# are wider than a refund's. It is still not unlimited.
#
# Chapter 15 replaced amount_on_invoice with amounts_grounded on both rules. Chapter 10
# narrowed issue_refund to an invoice id, which left apply_credit as the one write whose
# amount the model still writes freely. The comparator this rule required, though, runs
# only on refunds: it returned "not a refund" for every credit, so the requirement was
# met by a verdict that had not looked, and on the refund it does run against it raised
# KeyError, because Chapter 10 had removed the parameter it reads. Neither was visible
# until the controls were registered together.

[[rule]]
tool = "apply_credit"
mode = "copilot"
requires = ["amounts_grounded"]
auto_below = "500.00"
review_below = "5000.00"

[[rule]]
tool = "apply_credit"
mode = "queue-drain"
requires = ["amounts_grounded"]
auto_below = "100.00"
review_below = "1000.00"

# ----------------------------------------------------------- irreversible writes
# Money leaves the company and no counter-entry brings it back. The queue-drain bands
# are deliberately much narrower than copilot's, because the difference between the two
# modes is whether anybody is there.

[[rule]]
tool = "issue_refund"
mode = "copilot"
requires = ["invoice_owned", "structured_output"]
auto_below = "200.00"
review_below = "2000.00"

[[rule]]
tool = "issue_refund"
mode = "queue-drain"
# Chapter 10 narrowed issue_refund to an invoice id, so there is no amount for a
# comparator to judge. amount_on_invoice is replaced by invoice_owned, which asks a
# question with a decidable answer. The bands below now apply to the invoice's own
# amount, read from the ledger, and not to a number the model wrote.
requires = ["invoice_owned", "structured_output"]
auto_below = "50.00"
# No review band at all. Nobody is there to review, so an amount above the automatic
# band has no path rather than a slow one. Expressed by absence: a review_below of
# "0.00" would mean the same thing and the loader rejects it, because a review band
# below the auto band is a file that does not mean what its author thinks.

# post_ticket_reply is irreversible in the way that matters: a customer has read it.
[[rule]]
tool = "post_ticket_reply"
mode = "copilot"

[[rule]]
tool = "post_ticket_reply"
mode = "queue-drain"
requires = ["structured_output"]

# The escape hatch is always available, in every mode, with no conditions. A harness
# whose escalation path can itself be gated has no escape hatch.
[[rule]]
tool = "escalate_to_human"
mode = "copilot"

[[rule]]
tool = "escalate_to_human"
mode = "queue-drain"
